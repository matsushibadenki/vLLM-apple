name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install project and locked development tools
        run: python -m pip install -e . -r requirements-dev.lock
      - name: Run Python tests
        run: python -m unittest discover -s tests
      - name: Compile Python sources
        run: python -m compileall -q vllm_apple tests
      - name: Lint Python sources
        run: python -m ruff check vllm_apple tests

  swift:
    name: Swift package and Mac sample
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test Swift SDK
        run: swift test --package-path sdk/swift
      - name: Build SwiftUI Mac sample
        run: swift build --package-path samples/VLLMAppleChat
