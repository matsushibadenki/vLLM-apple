name: Mac integration package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    name: Unsigned Apple Silicon release candidate
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-package.lock
      - name: Install project and locked packaging tools
        run: python -m pip install . -r requirements-package.lock
      - name: Build app with standalone daemon
        run: scripts/build_mac_integration_package.sh "$RUNNER_TEMP/mac-integration"
      - name: Verify package checksum
        working-directory: ${{ runner.temp }}/mac-integration
        run: shasum -a 256 -c VLLMAppleChat-unsigned-arm64.zip.sha256
      - uses: actions/upload-artifact@v6
        with:
          name: VLLMAppleChat-unsigned-arm64
          path: ${{ runner.temp }}/mac-integration/*
          if-no-files-found: error
          retention-days: 14
