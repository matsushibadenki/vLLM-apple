name: Mac notarized release

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  release:
    name: Signed and notarized Apple Silicon app
    runs-on: macos-15
    timeout-minutes: 45
    environment: mac-release
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-package.lock
      - name: Validate release secrets
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          CODESIGN_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_BUILD_KEYCHAIN_PASSWORD }}
        run: scripts/validate_mac_release_credentials.sh
      - name: Install project and locked packaging tools
        run: python -m pip install . -r requirements-package.lock
      - name: Build unsigned release candidate
        run: scripts/build_mac_integration_package.sh "$RUNNER_TEMP/mac-unsigned"
      - name: Import Developer ID certificate into temporary keychain
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_BUILD_KEYCHAIN_PASSWORD }}
        run: |
          printf '%s' "$CERTIFICATE_P12_BASE64" \
            | openssl base64 -d -A -out "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/release.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/release.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/release.keychain-db"
          security import "$RUNNER_TEMP/developer-id.p12" \
            -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 \
            -k "$RUNNER_TEMP/release.keychain-db"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/release.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/release.keychain-db"
      - name: Materialize notarization API key
        env:
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: |
          printf '%s' "$NOTARY_KEY_BASE64" \
            | openssl base64 -d -A -out "$RUNNER_TEMP/AuthKey.p8"
      - name: Sign notarize and staple
        env:
          VLLM_APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          VLLM_APPLE_NOTARY_KEY: ${{ runner.temp }}/AuthKey.p8
          VLLM_APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          VLLM_APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          scripts/sign_and_notarize_mac_package.sh \
            "$RUNNER_TEMP/mac-unsigned/VLLMAppleChat-unsigned-arm64.zip" \
            "$RUNNER_TEMP/mac-notarized"
      - name: Create and verify bounded release manifest
        run: |
          vllm-apple-release-manifest create \
            "$RUNNER_TEMP/mac-notarized/VLLMAppleChat-notarized-arm64.zip" \
            --notary-report "$RUNNER_TEMP/mac-notarized/notary-result.json" \
            --source-commit "$GITHUB_SHA" \
            --build-run-id "$GITHUB_RUN_ID" \
            --runner-image "${ImageOS:-macos-15}" \
            --output "$RUNNER_TEMP/mac-notarized/release-manifest-v1.json"
          vllm-apple-release-manifest verify \
            "$RUNNER_TEMP/mac-notarized/VLLMAppleChat-notarized-arm64.zip" \
            --notary-report "$RUNNER_TEMP/mac-notarized/notary-result.json" \
            --manifest "$RUNNER_TEMP/mac-notarized/release-manifest-v1.json"
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ runner.temp }}/mac-notarized/VLLMAppleChat-notarized-arm64.zip
      - uses: actions/upload-artifact@v6
        with:
          name: VLLMAppleChat-notarized-arm64
          path: ${{ runner.temp }}/mac-notarized/*
          if-no-files-found: error
          retention-days: 14
      - name: Remove ephemeral signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/AuthKey.p8"
