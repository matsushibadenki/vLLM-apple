name: Apple Silicon model qualification

on:
  workflow_dispatch:
    inputs:
      model:
        description: Local model path or model ID available to the runner
        required: true
        type: string
      backend-executable:
        description: Absolute path to the selected backend executable
        required: true
        type: string
      backend-kind:
        description: Backend runtime to qualify
        required: true
        default: vllm_metal
        type: choice
        options:
          - vllm_metal
          - mlx_lm
      duration-seconds:
        description: Qualification duration; production certification requires at least 1800
        required: true
        default: "1800"
        type: string
      max-model-len:
        description: Optional maximum model context
        required: false
        type: string
      artifact-size-bytes:
        description: Optional exact download size; pair with estimated-resident-bytes
        required: false
        type: string
      estimated-resident-bytes:
        description: Optional exact resident estimate; pair with artifact-size-bytes
        required: false
        type: string
      artifact-target:
        description: Destination volume used for pre-download disk admission
        required: true
        default: models
        type: string
      upload-report:
        description: Upload reports as workflow artifacts (reports contain the model identifier)
        required: true
        default: false
        type: boolean

concurrency:
  group: apple-silicon-metal-qualification
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  qualify:
    runs-on: [self-hosted, macOS, ARM64, vllm-metal]
    timeout-minutes: 90
    env:
      QUALIFICATION_MODEL: ${{ inputs.model }}
      QUALIFICATION_BACKEND: ${{ inputs['backend-executable'] }}
      QUALIFICATION_BACKEND_KIND: ${{ inputs['backend-kind'] }}
      QUALIFICATION_DURATION: ${{ inputs['duration-seconds'] }}
      QUALIFICATION_MAX_MODEL_LEN: ${{ inputs['max-model-len'] }}
      QUALIFICATION_ARTIFACT_BYTES: ${{ inputs['artifact-size-bytes'] }}
      QUALIFICATION_RESIDENT_BYTES: ${{ inputs['estimated-resident-bytes'] }}
      QUALIFICATION_ARTIFACT_TARGET: ${{ inputs['artifact-target'] }}
    steps:
      - uses: actions/checkout@v6
        with:
          clean: true
          persist-credentials: false
      - name: Validate bounded numeric inputs
        run: |
          python3 - <<'PY'
          import os
          duration = int(os.environ["QUALIFICATION_DURATION"])
          if not 1800 <= duration <= 21600:
              raise SystemExit("duration-seconds must be between 1800 and 21600")
          value = os.environ.get("QUALIFICATION_MAX_MODEL_LEN", "")
          if value and not 1 <= int(value) <= 1048576:
              raise SystemExit("max-model-len must be between 1 and 1048576")
          if os.environ["QUALIFICATION_BACKEND_KIND"] not in {"vllm_metal", "mlx_lm"}:
              raise SystemExit("backend-kind is invalid")
          artifact = os.environ.get("QUALIFICATION_ARTIFACT_BYTES", "")
          resident = os.environ.get("QUALIFICATION_RESIDENT_BYTES", "")
          if bool(artifact) != bool(resident):
              raise SystemExit("artifact-size-bytes and estimated-resident-bytes must be provided together")
          for name, value in (("artifact-size-bytes", artifact), ("estimated-resident-bytes", resident)):
              if value and not 0 < int(value) <= 16384 * 1024**3:
                  raise SystemExit(f"{name} is outside the supported range")
          PY
      - name: Install dependency-free control plane
        run: python3 -m pip install -e .
      - name: Create private report directory
        run: install -d -m 700 qualification-results
      - name: Verify artifact memory and disk admission
        if: ${{ inputs['artifact-size-bytes'] != '' }}
        run: |
          python3 -m vllm_apple artifact-admission \
            --model "$QUALIFICATION_MODEL" \
            --artifact-bytes "$QUALIFICATION_ARTIFACT_BYTES" \
            --resident-bytes "$QUALIFICATION_RESIDENT_BYTES" \
            --target "$QUALIFICATION_ARTIFACT_TARGET" \
            > qualification-results/artifact-admission.json
      - name: Verify Apple Silicon, memory pressure, and backend compatibility
        run: |
          python3 -m vllm_apple qualification-preflight \
            --backend-executable "$QUALIFICATION_BACKEND" \
            --backend-kind "$QUALIFICATION_BACKEND_KIND" \
            > qualification-results/preflight.json
      - name: Run sampling, streaming, and 30-minute memory qualification
        run: |
          arguments=(
            qualify-model "$QUALIFICATION_MODEL"
            --backend-executable "$QUALIFICATION_BACKEND"
            --backend-kind "$QUALIFICATION_BACKEND_KIND"
            --duration "$QUALIFICATION_DURATION"
          )
          if [[ -n "$QUALIFICATION_MAX_MODEL_LEN" ]]; then
            arguments+=(--max-model-len "$QUALIFICATION_MAX_MODEL_LEN")
          fi
          python3 -m vllm_apple "${arguments[@]}" \
            > qualification-results/qualification.json
      - name: Verify report with the Mac SDK decoder
        run: |
          evidence=(--require-phase-profile --require-quality-smoke --require-memory-fit --require-text-only)
          if [[ -n "$QUALIFICATION_ARTIFACT_BYTES" ]]; then
            evidence+=(--require-artifact-admission)
          fi
          swift run --package-path sdk/swift \
            VLLMAppleQualificationCheck qualification-results "${evidence[@]}"
      - name: Restrict report permissions
        if: always()
        run: chmod -R go-rwx qualification-results
      - name: Upload qualification reports
        if: ${{ always() && inputs['upload-report'] }}
        uses: actions/upload-artifact@v4
        with:
          name: apple-silicon-metal-qualification
          path: qualification-results/*.json
          if-no-files-found: error
          retention-days: 14
