[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-apple"
version = "0.1.0"
description = "Memory-aware Apple Silicon runtime control plane for vLLM"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "vLLM-Apple contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
vllm-apple = "vllm_apple.cli:main"
vllm-appled = "vllm_apple.daemon:main"

[tool.setuptools.packages.find]
include = ["vllm_apple*"]

[tool.ruff]
line-length = 100
target-version = "py310"

